# The Zed extension for cartan. Zed compiles the grammar from the
# tree-sitter-cartan repository named below — a mirror printed from
# the language's grammar value, refreshed per release — and the
# language server is `cartan lsp`, a verb of the shipped binary,
# which src/lib.rs finds on the PATH.
id = "cartan"
name = "Cartan"
description = "Cartan language support: syntax highlighting for .cart documents and ```cart fences in Markdown, and the cartan language server."
version = "0.8.3"
schema_version = 1
authors = ["Jonathan Zrake <jonathan.zrake@gmail.com>"]
repository = "https://github.com/cartan-lang/zed-cartan"

[language_servers.cartan]
name = "cartan"
languages = ["Cartan"]

[grammars.cartan]
repository = "https://github.com/cartan-lang/tree-sitter-cartan"
rev = "aa4f2e22f30d1a047581af385987ba88eab8ce6f"
